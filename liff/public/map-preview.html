<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>回咖啡地圖預覽</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #faf8f5;
        margin: 0;
        padding: 24px 16px;
        color: #333;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 16px;
        color: #5a3d7a;
      }
      .location-map-wrap {
        max-width: 420px;
        margin: 0 auto;
      }
      .location-map {
        width: 100%;
        height: auto;
        border-radius: 8px;
        border: 1px solid #e8e4dc;
        background: #fff;
      }
      .location-map-note {
        font-size: 0.82rem;
        color: #888;
        margin: 8px 0 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>回咖啡位置示意圖（預覽）</h1>
    <div class="location-map-wrap">
      <svg viewBox="0 0 340 250" class="location-map" role="img" aria-label="回咖啡位置示意圖">
        <rect width="340" height="250" fill="#f3f1eb" rx="8" />
        <line x1="48" y1="8" x2="48" y2="242" stroke="#9eb3c9" stroke-width="24" stroke-linecap="round" />
        <text x="58" y="36" fill="#c0392b" font-size="10" font-weight="700">茄苳景觀大道</text>
        <line x1="48" y1="78" x2="145" y2="108" stroke="#d5d0c8" stroke-width="7" stroke-linecap="round" />
        <rect x="88" y="48" width="22" height="16" rx="2" fill="#e8e4dc" stroke="#bbb" stroke-width="1" />
        <polygon points="88,48 99,40 110,48" fill="#c0392b" opacity="0.85" />
        <text x="118" y="60" fill="#c0392b" font-size="10" font-weight="700">頂埔國小</text>
        <line x1="248" y1="8" x2="248" y2="242" stroke="#b0b0b0" stroke-width="12" stroke-linecap="round" />
        <text x="256" y="118" fill="#c0392b" font-size="11" font-weight="700">經國路三段</text>
        <line x1="8" y1="208" x2="332" y2="208" stroke="#999" stroke-width="18" stroke-linecap="round" />
        <text x="148" y="236" fill="#c0392b" font-size="10" font-weight="700">中華路四段</text>
        <line x1="108" y1="132" x2="248" y2="132" stroke="#d5d0c8" stroke-width="7" stroke-linecap="round" />
        <text x="112" y="124" fill="#888" font-size="9" font-weight="600">92巷</text>
        <rect x="168" y="108" width="28" height="20" rx="3" fill="#fff" stroke="#7b5ea7" stroke-width="1.5" />
        <text x="182" y="122" text-anchor="middle" fill="#7b5ea7" font-size="11" font-weight="700">P</text>
        <text x="200" y="122" fill="#c0392b" font-size="9" font-weight="700">停車場</text>
        <circle cx="138" cy="132" r="16" fill="#c0392b" opacity="0.15" />
        <path d="M138 112c-7 0-12 5-12 12 0 9 12 22 12 22s12-13 12-22c0-7-5-12-12-12z" fill="#c0392b" />
        <circle cx="138" cy="124" r="3.5" fill="#fff" />
        <text x="138" y="158" text-anchor="middle" fill="#333" font-size="11" font-weight="700">回咖啡</text>
        <text x="300" y="236" fill="#c0392b" font-size="10" font-weight="700">火車站 →</text>
      </svg>
      <p class="location-map-note">
        新竹市東區 · 經國路三段92巷內（旁有停車場）· 近茄苳景觀大道與頂埔國小
      </p>
    </div>
  </body>
</html>
