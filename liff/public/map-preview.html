<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>回咖啡地圖預覽</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #faf8f5;
        margin: 0;
        padding: 24px 16px;
        color: #333;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 16px;
        color: #5a3d7a;
      }
      .location-map-wrap {
        max-width: 420px;
        margin: 0 auto;
      }
      .location-map {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>回咖啡上課地點（map.png）</h1>
    <div class="location-map-wrap">
      <img
        src="/map.png"
        alt="回咖啡上課地點示意圖"
        class="location-map"
      />
    </div>
  </body>
</html>
