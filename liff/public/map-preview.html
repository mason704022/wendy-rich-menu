<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>回咖啡地圖預覽</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #faf8f5;
        margin: 0;
        padding: 24px 16px;
        color: #333;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 16px;
        color: #5a3d7a;
      }
      .location-map-wrap {
        max-width: 320px;
        margin: 0 auto;
      }
      .location-map {
        width: 100%;
        height: auto;
        display: block;
      }
      .location-map-note {
        font-size: 0.82rem;
        color: #888;
        margin: 8px 0 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>回咖啡位置示意圖（圓形 v16）</h1>
    <div class="location-map-wrap">
      <svg viewBox="0 0 280 280" class="location-map" role="img" aria-label="回咖啡位置示意圖">
        <defs>
          <clipPath id="mapCircle">
            <circle cx="140" cy="140" r="132" />
          </clipPath>
        </defs>
        <g clip-path="url(#mapCircle)">
          <circle cx="140" cy="140" r="132" fill="#6d5048" />
          <g transform="translate(0, -33)">
            <line x1="72" y1="18" x2="72" y2="305" stroke="#fff" stroke-width="15" />
            <line x1="208" y1="18" x2="208" y2="305" stroke="#fff" stroke-width="15" />
            <line x1="8" y1="218" x2="272" y2="218" stroke="#fff" stroke-width="17" />
            <line x1="118" y1="128" x2="208" y2="128" stroke="#fff" stroke-width="10" />
            <text x="72" y="94" text-anchor="middle" fill="#111" font-size="9" font-weight="800">
              <tspan x="72" dy="0">茄</tspan>
              <tspan x="72" dy="18">苳</tspan>
              <tspan x="72" dy="18">景</tspan>
              <tspan x="72" dy="18">觀</tspan>
              <tspan x="72" dy="18">大</tspan>
              <tspan x="72" dy="18">道</tspan>
            </text>
            <text x="208" y="99" text-anchor="middle" fill="#111" font-size="10" font-weight="800">
              <tspan x="208" dy="0">經</tspan>
              <tspan x="208" dy="20">國</tspan>
              <tspan x="208" dy="20">路</tspan>
              <tspan x="208" dy="20">三</tspan>
              <tspan x="208" dy="20">段</tspan>
            </text>
            <text y="223" fill="#111" font-size="10" font-weight="800">
              <tspan x="95">中</tspan>
              <tspan x="115">華</tspan>
              <tspan x="135">路</tspan>
              <tspan x="155">四</tspan>
              <tspan x="175">段</tspan>
            </text>
            <text x="168" y="132" text-anchor="middle" fill="#111" font-size="9" font-weight="800">92巷</text>
            <rect x="96" y="133" width="78" height="28" fill="#e8dcc8" />
            <text x="135" y="152" text-anchor="middle" fill="#111" font-size="16" font-weight="800">回咖啡</text>
            <g transform="translate(135, 124) scale(0.55) translate(-12, -24)">
              <path d="M12 2c-5.5 0-10 4.5-10 10 0 7.5 10 18 10 18s10-10.5 10-18c0-5.5-4.5-10-10-10z" fill="#c0392b" />
              <circle cx="12" cy="12" r="3" fill="#fff" />
            </g>
            <rect x="178" y="133" width="22" height="22" fill="#f0e6d4" />
            <text x="189" y="148" text-anchor="middle" fill="#111" font-size="11" font-weight="800">P</text>
            <rect x="88" y="234" width="104" height="28" fill="#888" />
            <text x="140" y="253" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">新竹火車站 →</text>
          </g>
        </g>
        <circle cx="140" cy="140" r="132" fill="none" stroke="#5a4038" stroke-width="1" />
      </svg>
      <p class="location-map-note">
        新竹市香山區經國路三段92巷29號（旁有收費停車場）· 近茄苳景觀大道與頂埔國小
      </p>
    </div>
  </body>
</html>
